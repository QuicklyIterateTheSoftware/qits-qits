# THE WRAPPER'S RELEASE CYCLE, IN ONE FILE, AND IT IS ONE PHASE LONG. This is the last repository
# of the estate to move onto `.config/qits/release.yml`, and it is the one that fits the grammar
# least comfortably: it declares a `release-request:` slot and NO ARCHETYPE, because no archetype
# describes a repository whose build is an estate declaration. The slot parser says so itself — a
# slot file "declares at least one of 'archetype', 'release-request', 'release', 'artifacts' or
# 'userflows'" — so a bespoke QA slot standing alone is a shape the format was written to admit,
# not one it is being bent into.
#
# NO `release:` SLOT, AND THEREFORE NO PHASE TWO OR THREE. The wrapper publishes nothing: there is
# no jar, no image, no bundle, no SBOM, so there is nothing for a publish phase to do and no
# `artifacts:` to declare. That is the same shape every spa-frontend and cli repository has, and
# the composer reads it the honest way — a phase nothing declares steps for gets no trigger
# document and no run at all, rather than an empty run that goes green.
#
# WHAT A WRAPPER RELEASE IS is what the steps below gate. The wrapper's content is the estate
# declaration: .gitmodules naming every component repository, and the maintenance and project
# settings under .config/qits. So the gate checks that declaration is sound rather than
# pretending there is something to compile: .gitmodules parses, every entry carries a path and a
# RELATIVE url (an absolute url would silently build from the wrong host — the 2026-08-30 lesson),
# and no two entries share a path.
#
# AND THE PINS THEMSELVES, WHICH THIS RUN CAN SEE. The estate is not banked: a release commit
# carries the version bump and nothing else, and a gitlink moves the way everything else here
# moves — an ordinary commit that qits-maintenance pushes onto the branch, resolved from the
# sibling's released tag. So the pins are IN THE FOLD, and a fold is exactly what this run has.
# The second step reads every 160000 entry out of the fold's own tree and resolves it in the
# repository it names. That is what makes a wrapper version mean something: a green verdict here
# says the estate this release declares is one that exists, at versions somebody released, and the
# person who approves the fold approves that same estate. Nothing downstream repairs a bad pin —
# the release refuses it — so a red here is the cheap end of the same refusal.
#
# EVENT, SELECTION AND CHECKOUT ARE THE COMPOSER'S NOW, and they come out identical to what this
# repository used to spell by hand: ReleaseRequestChanged, `repoName: { exact: qits-qits }`, and a
# checkout of backingBranch at mergedSha. Decide at main, build at the fold, like every sibling's —
# the slot file is read at this repository's main head; the run checks out the fold.

release-request:
  - image: qits/build-images/ci-base:latest
    timeout-seconds: 300
    script: |
      # Kept rather than leaned on: the composer already runs a declared script under `-eu`, but
      # the line costs nothing and is what made this check fail rather than pass back when the
      # daemon ran it with `bash -c` and no -e — a swallowed check is a green verdict for a broken
      # estate declaration.
      set -eu
      test -f .gitmodules || { echo "the wrapper declares no .gitmodules" >&2; exit 1; }
      # git itself is the parser: a syntactically broken file fails here, not downstream.
      paths=$(git config -f .gitmodules --get-regexp 'submodule\..*\.path' | awk '{print $2}')
      test -n "$paths" || { echo ".gitmodules declares no submodules" >&2; exit 1; }
      dupes=$(printf '%s\n' "$paths" | sort | uniq -d)
      test -z "$dupes" || { echo "two entries share a path:" "$dupes" >&2; exit 1; }
      bad=$(git config -f .gitmodules --get-regexp 'submodule\..*\.url' | awk '$2 !~ /^\.\.\// {print $2}')
      test -z "$bad" || { echo "non-relative submodule url(s):" "$bad" >&2; exit 1; }
      count=$(printf '%s\n' "$paths" | wc -l)
      echo "the estate declares $count submodules, all paths unique, all urls relative"

  # THE ESTATE ITSELF: EVERY DECLARED SUBMODULE PINNED, AND EVERY PIN REAL. The step above reads
  # `.gitmodules` and nothing else, which is a lint on a config file. This one leaves the file and
  # asks the git host whether the estate the fold declares exists.
  #
  # Three failures, and they are different failures. A DECLARED ENTRY WITH NO GITLINK is a
  # component the wrapper claims to name and does not: `update --init` leaves an empty directory
  # and a release would ship a version naming an estate with a hole in it. AN ENTRY THAT IS NOT A
  # 160000 is worse and quieter — a file or a directory committed over a submodule path, which
  # every submodule command then walks straight past. A PIN THE SIBLING CANNOT RESOLVE is the one
  # the release refuses outright: a sha from a branch that was rewritten, a fold rebased onto a
  # bump whose sibling release was withdrawn, or a gitlink somebody moved by hand to a commit that
  # only ever existed in their working copy.
  #
  # RESOLVING MEANS FETCHING, NOT `cat-file -e`. The daemon's clone holds none of the sibling's
  # objects, so a bare `git cat-file -e <sha>` here would fail for every pin that is perfectly
  # good; the object has to be brought over before the question can be asked at all. Heads AND
  # tags are fetched because the release's own guard asks whether the HOST can resolve the commit,
  # not whether it is tagged — a pin is written from a released tag today, and a check narrower
  # than the guard it stands in for would go red on a fold the release would have taken.
  - image: qits/build-images/ci-base:latest
    timeout-seconds: 900
    script: |
      set -eu
      test -f .gitmodules || { echo "the wrapper declares no .gitmodules" >&2; exit 1; }
      # `--get-regexp` exits 1 on no match, which under `set -eu` would end the step with no
      # message at all; the step above owns that failure and says it properly.
      keys=$(git config -f .gitmodules --name-only --get-regexp '^submodule\..*\.path$' || :)
      test -n "$keys" || { echo ".gitmodules declares no submodules" >&2; exit 1; }
      test -n "${QITS_CI_REPOSITORY_URL:-}" || {
        echo "this run was given no repository url, so no sibling is addressable" >&2; exit 1; }

      # The sibling is derived from OUR OWN clone url, the same derivation the maintenance bump's
      # gitlink arm and the java-service archetype make: every repository of a project is a sibling
      # path under one host, and the url this run was cloned from is the only address certainly
      # reachable from this container. The committed url is deliberately relative and says nothing
      # about a host - which is the property the step above enforces and this one depends on.
      origin_parent="${QITS_CI_REPOSITORY_URL%/*}"

      # The fold is already checked out at the merged sha, so HEAD is the tree being gated.
      failed=0
      checked=0
      for key in $keys; do
        name=${key#submodule.}
        name=${name%.path}
        path=$(git config -f .gitmodules --get "$key")
        # The name reaches a clone url, so it is held to a repository name and nothing else - a
        # slash would address something else on the host, and `..` is how you leave a path at all.
        case "$name" in
          ''|*..*|*[!0-9A-Za-z._-]*)
            echo "refusing an implausible submodule name: $name" >&2; exit 1 ;;
        esac

        entry=$(git ls-tree HEAD -- "$path")
        if [ -z "$entry" ]; then
          echo "$name: .gitmodules declares $path, and the fold's tree has nothing there" >&2
          failed=$((failed + 1))
          continue
        fi
        mode=$(printf '%s\n' "$entry" | awk '{print $1}')
        sha=$(printf '%s\n' "$entry" | awk '{print $3}')
        if [ "$mode" != "160000" ]; then
          echo "$name: $path is mode $mode in the fold's tree, not a 160000 gitlink" >&2
          failed=$((failed + 1))
          continue
        fi

        # Fetched into ONE namespace, forced, reused by every entry: the refs are scratch and only
        # the objects matter, so no submodule name is ever interpolated into a ref name.
        # `--filter=blob:none` asks for commits and trees and leaves the file contents on the host,
        # which is the whole history at a fraction of the bytes. A host that will not serve a
        # partial fetch says so, and the plain fetch behind it is what the maintenance bump uses.
        sibling="$origin_parent/$name"
        if ! git fetch -q --no-tags --filter=blob:none "$sibling" \
                 '+refs/heads/*:refs/estate/heads/*' '+refs/tags/*:refs/estate/tags/*' 2>/dev/null \
           && ! git fetch -q --no-tags "$sibling" \
                 '+refs/heads/*:refs/estate/heads/*' '+refs/tags/*:refs/estate/tags/*'; then
          echo "$name: cannot read $sibling, so its pin $sha cannot be checked" >&2
          failed=$((failed + 1))
          continue
        fi
        # Peeled to a commit: a gitlink that resolves to anything else is not a submodule state.
        if ! git cat-file -e "$sha^{commit}" 2>/dev/null; then
          echo "$name: pinned at $sha, which $sibling holds on no branch and no tag" >&2
          failed=$((failed + 1))
          continue
        fi
        checked=$((checked + 1))
        echo "$name is pinned at $sha, which $name holds"
      done

      test "$failed" = 0 || {
        echo "$failed of the declared submodules do not carry a pin this estate can stand on;" >&2
        echo "the pins live in the branch, so fix them there - a release will not write them." >&2
        exit 1; }
      echo "all $checked declared submodules are pinned at a commit their own repository holds"
