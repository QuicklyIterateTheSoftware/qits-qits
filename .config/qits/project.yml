# Whether this project's services are deployed once per environment.
# Absent file, absent key and `true` all mean the same thing: this project
# supports environments. Only an explicit `false` changes anything — it says
# the project has exactly one environment, its name locked to what the
# project already has.
supports_environments: false

# The front desk (qits-767): keep the qits project's desk up permanently, with its
# project.work session started by the daemon and reachable on claude.ai.
front_desk:
  lifecycle: ALWAYS_ON
  # The delivery loop (qits-1440): the desk's project.delivery session, with its own
  # qits:desk token, dispatches the backlog newest first, approves what `approves`
  # hands it and starts REFINED items, within these limits.
  # `automation` and `contract` (qits-1517) let it approve a member request of an item
  # in flight under rule member-ci-green, once every gate before approval is green.
  # `config-directory` (qits-1560) lets it approve a fold that changes .config/qits/,
  # this file included: it reads each change against the work the request carries,
  # approves what is expected and correct, and asks the owner once when a change is
  # unexpected, wrong or unclear. A fold whose changes could not be read, or have not
  # been read yet, holds the same requirement but stays a person's.
  # `no-changes` (qits-1568) lets it approve, under rule manual-review-verified, a fold
  # that adds nothing to main for work it names; an empty request naming no work item
  # stays the owner's.
  delivery:
    enabled: true
    max_running: 5
    start_refined: true
    approves: [manual-review, artifact-declarations, automation, contract, config-directory, no-changes]
