# Whether this project's services are deployed once per environment.
# Absent file, absent key and `true` all mean the same thing: this project
# supports environments. Only an explicit `false` changes anything — it says
# the project has exactly one environment, its name locked to what the
# project already has.
supports_environments: false

# The front desk (qits-767): keep the qits project's desk up permanently, with its
# project.work session started by the daemon and reachable on claude.ai.
front_desk:
  lifecycle: ALWAYS_ON
  # The delivery loop (qits-1440): the desk's project.delivery session, with its own
  # qits:desk token, dispatches the backlog newest first, approves what `approves`
  # hands it and starts REFINED items, within these limits. A change here is a
  # wrapper release, which a person approves; the desk never widens its own rules.
  delivery:
    enabled: true
    max_running: 5
    start_refined: true
    approves: [manual-review, artifact-declarations]
    interval: PT15M
